<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        html, body, h1, figure {
            margin: 0;
            padding: 0;
            border: 0;
        }
        header {
            background-image: url("https://cdn.prod.website-files.com/6175511828685f75c55ed014/61a4d8bb4f39c36c882a8566_Computer-Vision.jpg");
            background-size: cover;
            background-position: center;
            background-color: rgba(0, 0, 0, 0.5); 
            background-blend-mode: multiply;
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 50px 100px rgba(0, 0, 0, 0.15);
        }
        nav {
            display: flex;
        }
        nav > a {
            font-family: "Roboto Slab", serif;
            border-left: 1px black solid;
            border-bottom: 1px black solid;
            width: calc(100% * 1/7);
            text-decoration: none;
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 6rem;
            text-align: center;
            font-family: "Roboto Slab", serif;
        }
        main {
            padding-block: 75px;
            display: flex;
            flex-direction: column;
            row-gap: 45px;
            width: 100%;
        }
        .left-sect {
            margin-left: calc((100% * 1/6) * 1/3);
            margin-right: calc((100% * 1/6) * 2/3);
        }
        .right-sect {
            margin-left: calc((100% * 1/6) * 2/3);
            margin-right: calc((100% * 1/6) * 1/3);
        }
        .click-box {
            border: 2px black solid;
            background-color: white;
            height: 350px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 25px;
            background-blend-mode: normal;
            transition: white 0.1s ease;
            padding-inline: 25px;
        }
        .click-box:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.12);
        }
        figure {
            height: 100%;
            width: 100%;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .click-box:active {
            background-color: rgba(50, 50, 50, 0.4);
            background-blend-mode: multiply; 
        }
        .left-fig {
            flex-direction: row;
        }
        .right-fig {
            flex-direction: row-reverse;
        }
        img {
            width: 40%;
            height: 90%;
            object-fit: cover;
            align-self: center;
            border-radius: 25px;
        }
        .cap-box {
            width: 50%;
            padding-inline: 20px;
            font-family: "Roboto Slab", serif;
        }
        h2 {
            font-size: 2rem;
            margin-top: 0;
        }
        figcaption {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Eric Nguyen's<br>CS180 Portfolio!</h1>
        <p style="color:white; font-size:2rem;">EricNguyen1213.github.io</p>
    </header>
    <nav>
        <a href="./index.html" style="border-left: 0px">
            <h3>Home</h3>
        </a>
        <a href="./0/index.html">
            <h3>Project 0</h3>
        </a>
        <a href="./1/index.html">
            <h3>Project 1</h3>
        </a>
        <a href="./2/index.html">
            <h3>Project 2</h3>
        </a>
        <a href="./3/index.html">
            <h3>Project 3</h3>
        </a>
        <a href="./4/index.html">
            <h3>Project 4</h3>
        </a>
        <a href="./5/index.html">
            <h3>Final Project</h3>
        </a>
    </nav>
    <main>
        <a href="./0/index.html" class="click-box left-sect">
            <figure class="left-fig">
                <img src="https://cal-cs180.github.io/fa26/hw/proj0/selfie.png">
                <div class="cap-box">
                    <h2>Project 0:</h2>
                    <figcaption>Becoming Friends with Your Camera</figcaption>
                </div>
            </figure>
        </a>
        <a href="./1/index.html" class="click-box right-sect">
            <figure class="right-fig">
                <img src="https://cal-cs180.github.io/fa26/463_files/image004.jpg">
                <div class="cap-box">
                    <h2>Project 1:</h2>
                    <figcaption>Images of the Russian Empire -- Colorizing the Prokudin-Gorskii Photo Collection</figcaption>
                </div>
            </figure>
        </a>
        <a href="./2/index.html" class="click-box left-sect">
            <figure class="left-fig">
                <img src="https://cal-cs180.github.io/fa26/463_files/hybrid.png">
                <div class="cap-box">
                    <h2>Project 2:</h2>
                    <figcaption>Fun with Filters and Frequencies</figcaption>
                </div>
            </figure>
        </a>
        <a href="./3/index.html" class="click-box right-sect">
            <figure class="right-fig">
                <img src="https://cal-cs180.github.io/fa26/463_files/proj5_index.png">
                <div class="cap-box">
                    <h2>Project 3:</h2>
                    <figcaption>Fun with Diffusion Models</figcaption>
                </div>
            </figure>
        </a>
        <a href="./4/index.html" class="click-box left-sect">
            <figure class="left-fig">
                <img src="https://cal-cs180.github.io/fa26/463_files/image028.jpg">
                <div class="cap-box">
                    <h2>Project 4:</h2>
                    <figcaption>Autostitching and Photo Mosaics</figcaption>
                </div>
            </figure>
        </a>
        <a href="./5/index.html" class="click-box right-sect">
            <figure class="right-fig">
                <img src="https://t3.ftcdn.net/jpg/02/36/99/22/360_F_236992283_sNOxCVQeFLd5pdqaKGh8DRGMZy7P4XKm.jpg">
                <div class="cap-box">
                    <h2>Project 5:</h2>
                    <figcaption>Final Project</figcaption>
                </div>
            </figure>
        </a>
    </main>
</body>
</html>
